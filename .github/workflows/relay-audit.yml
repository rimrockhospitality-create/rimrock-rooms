name: Relay staging regression audit
on:
  push:
    branches: ['revival/staging']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --check pm.js
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run test:backend
      - run: npm test
